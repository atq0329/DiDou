<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>DiDou</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Red+Rose:wght@400;700&display=swap">
  <link rel="stylesheet" href="styles.css">

</head>

<body>
  <!-- Trip Info -->
  <h2 id="memberName"></h2>
  <h1 id="tripName"></h1>

  <script>
    // Temporary variables (simulate login/trip info)
    const member = "Nguyen Van A";   // change this to test
    const trip = "Summer Trip 2025"; // change this to test

    // Show on page
    document.getElementById("memberName").textContent = `${member} (Trip Member)`;
    document.getElementById("tripName").textContent = trip;
  </script>

  <!-- Section A: Wishlist View -->
  <div id="wishlistView">
    <h2>Add to your activity wishlist!</h2>

    <!-- Activity list -->
    <div id="activityList" style="max-height: 200px; overflow-y: auto;"></div>
    <!-- Add activity form -->
    <button id="toggleAddBtn">+</button>
    <div id="addBox" style="display:none;">
      <form id="activityForm">
        <label>Activity: <input type="text" id="activityName" required /></label><br>
        <label>Category:
          <select id="activityCategory" required>
            <option value="">-- Select a category --</option>
            <option value="Food & Drink">Food & Drink</option>
            <option value="Cafe">Cafe</option>
            <option value="Entertainment">Entertainment</option>
          </select>
        </label><br>
        <label>Time Period:
          <select id="activityPeriod" required>
            <option value="">-- Select a Period --</option>
            <option value="Morning">Morning</option>
            <option value="Afternoon">Afternoon</option>
            <option value="Evening">Evening</option>
          </select>
        </label><br>
        <button type="submit">Save</button>
      </form>
      <!-- Plus button -->

    </div>
  </div>

  <script>
    const API_URL = "http://localhost:3000";

    // Toggle add form
    document.getElementById("toggleAddBtn").addEventListener("click", () => {
      const box = document.getElementById("addBox");
      box.style.display = box.style.display === "none" ? "block" : "none";
    });

    // Load activities
    async function loadActivities() {
      const res = await fetch(`${API_URL}/activities`);
      const activities = await res.json();

      const listDiv = document.getElementById("activityList");
      listDiv.innerHTML = "";

      activities.forEach(act => {
        // create a button
        const btn = document.createElement("button");
        btn.textContent = `${act.name}\nTime Period: ${act.time_period}`;
        btn.style.whiteSpace = "pre-line";   // allow \n new lines
        btn.style.textAlign = "left";        // align text to the left
        btn.style.display = "block";
        btn.style.marginBottom = "8px";  // space between buttons
        // add button into the list
        listDiv.appendChild(btn);
      });
    }

    // Add activity
    document.getElementById("activityForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      // get values from the form
      const name = document.getElementById("activityName").value;
      const category = document.getElementById("activityCategory").value;
      const time_period = document.getElementById("activityPeriod").value;
      const addressInput = document.getElementById("activityAddress");
      const address = addressInput ? addressInput.value : null;

      try {
    const res = await fetch(`${API_URL}/activities`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, category, time_period, address }),
    });

    const data = await res.json(); // always parse response

    if (!res.ok) {
      // check error message from backend
      if (data.error.includes("required")) {
        alert("Please fill in all required fields: name, category, and time period.");
      } else if (data.error.includes("UNIQUE")) {
        alert("This activity already exists for the selected time period.");
      } else {
        alert("Error: " + data.error);
      }
      return;
    }
    
    document.getElementById("addBox").style.display = "none";
    loadActivities();

  } catch (err) {
    alert("Network or server error: " + err.message);
  }
});

    // Run on page load
    loadActivities();

  </script>


</body>

</html>
