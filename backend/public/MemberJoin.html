<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DiDou - Join Trip</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="card">
    <header class="center">
      <img src="logo.JPG" alt="DiDou" class="logo"/>
      <h2>Join a Trip</h2>
      <p class="subtitle">Enter a trip ID or select from the list</p>
    </header>

    <form id="joinForm">
      <label for="tripIdInput">Trip ID</label>
      <input id="tripIdInput" type="text" placeholder="Paste trip ID" required/>
      <div class="toolbar" style="margin-top:12px">
        <button type="submit" class="primary">Join Trip</button>
        <button type="button" id="refreshTrips" class="secondary">Refresh Trips</button>
      </div>
      <div id="msg" class="msg"></div>
    </form>

    <h3 class="center">Available Trips</h3>
    <select id="tripSelect" style="width:100%;margin-top:6px"></select>

    <div id="joinedActions" class="hidden center" style="margin-top:16px">
      <p class="msg ok" id="joinedMsg"></p>
      <button id="goAvailability" class="primary">Set Availability</button>
      <button id="goWishlist" class="secondary">Go to Wishlist</button>
    </div>
  </div>

<script>
  const $ = s => document.querySelector(s);
  const user = JSON.parse(localStorage.getItem('didou_user')||'null');
  if(!user){
    alert('Please sign in first');
    location.href='/index.html';
  }

  const tripSelect = $('#tripSelect');
  const form = $('#joinForm');
  const msg = $('#msg');
  const joinedActions = $('#joinedActions');
  const joinedMsg = $('#joinedMsg');
  let currentTripId = null;

  function setMsg(text,type=''){ msg.textContent=text; msg.className='msg'+(type?' '+type:''); }

  async function loadTrips(){
    try{
      const r = await fetch('/api/trips');
      const data = await r.json();
      tripSelect.innerHTML = data.map(t=>`<option value="${t.id}">${t.name||t.id} — ${t.destination||'TBA'}</option>`).join('');
    }catch(e){ setMsg('Error loading trips','err'); }
  }

  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const tripId = $('#tripIdInput').value.trim() || tripSelect.value;
    if(!tripId){ setMsg('Please enter or select a trip ID','err'); return; }
    currentTripId = tripId;
    try{
      // just confirm trip exists
      const r = await fetch(`/api/trips/${encodeURIComponent(tripId)}`);
      if(!r.ok) throw new Error('Trip not found');
      const trip = await r.json();
      joinedMsg.textContent = `Joined trip: ${trip.name||trip.id}`;
      joinedActions.classList.remove('hidden');
      setMsg('');
    }catch(e){ setMsg(e.message||'Join failed','err'); }
  });

  $('#refreshTrips').addEventListener('click', loadTrips);

  $('#goAvailability').addEventListener('click', ()=>{
    if(currentTripId) location.href=`/MemberAvailability.html?tripId=${encodeURIComponent(currentTripId)}&userId=${user.id}`;
  });

  $('#goWishlist').addEventListener('click', ()=>{
    if(currentTripId) location.href=`/AllWishes.html?tripId=${encodeURIComponent(currentTripId)}`;
  });

  loadTrips();
</script>
</body>
</html>
