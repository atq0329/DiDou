<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Trip Create</title>

  <style>
    /* Card */
    .bigBox{
      width: 760px; max-width: 95vw;
      background:#3439a1; border:1px solid #333; border-radius:8px;
      padding:28px; margin:40px auto; box-sizing:border-box;
    }
    .bigBox h2{ color:#efc738; text-align:center; margin:0 0 18px; }

    /* Base inputs */
    input[type="text"], input[type="date"], select{
      padding:8px 10px; border:1px solid black; border-radius:4px;
      font-size:14px; outline:none; background:#fff; box-sizing:border-box;
    }
    .select{
      -webkit-appearance:none; -moz-appearance:none; appearance:none;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23555' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
      background-repeat:no-repeat; background-position:right 12px center; background-size:16px;
    }
    input:invalid:not(:focus):not(:placeholder-shown){ border-color:#d00; }
    .error-msg{ display:none; color:#d00; font-size:.9rem; margin-top:4px; }

    /* 2-column form: labels | controls */
    .form{ display:flex; flex-direction:column; gap:16px; }
    .row{
      display:grid; grid-template-columns: 210px 1fr; column-gap:16px; align-items:center;
    }
    .row > label{ color:white; font-weight:bold; }

    /* Inside the controls column, place paired controls side-by-side */
    /* Inside the controls column, place paired controls side-by-side */
/* --- Align inputs & make the date boxes longer --- */
/* --- Alignment + sizing inside the purple card --- */
:root{
  --inline-label-w: 120px;   /* width of the small inline labels */
  --control-w: 230px;        /* desired width for each control */
}

/* two halves for the dates/duration row */
.controls-2{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  align-items: center;
}

/* label + input per half */
.inline{
  display: grid;
  grid-template-columns: var(--inline-label-w) var(--control-w);
  column-gap: 10px;
  align-items: center;
}

/* keep controls from stretching past the card */
#drpStart, #drpEnd, #duration, #deadline{
  width: 200px;
  max-width: 100%;
  box-sizing: border-box;
}

/* --- Make ALL labels look like “Trip Name” --- */
.row > label,
.sublabel{
  color: #fff;
  font-weight: bold;
  /* optional: match size/line-height if needed */
  /* font-size: 20px;  line-height: 1.2; */
}



    /* Fixed widths so things align neatly */
    #tripName, #dest{ width: 380px; }

    /* Errors */
    .drp-error{
      color:#ffdddd; background:#7c0000; padding:6px 8px; border-radius:6px; display:none;
      grid-column: 2 / 3; /* show under controls column */
    }
    .drp-error.show{ display:block; }

    /* Button */
    #creatTrip{
      padding:10px 14px; border-radius:8px; border:0; background:#efc738; cursor:pointer; font-weight:bold;
    }

    body{ background:#648de5; }
  </style>
</head>

<body>
  <div style="text-align:center;">
    <img src="logo.png" alt="Logo" width="141" height="200">
  </div>

  <div class="bigBox">
    <h2><span id="leaderName"></span> (Trip Leader)</h2>

    <div class="form">
      <!-- Trip Name -->
      <div class="row">
        <label for="tripName">Trip Name</label>
        <div>
          <input type="text" id="tripName" placeholder="Enter your trip name" required>
          <div class="error-msg">Please enter a trip name.</div>
        </div>
      </div>

      <!-- Destination -->
      <div class="row">
        <label for="dest">Destination City</label>
        <input type="text" id="dest" placeholder="Enter your destination city" required>
      </div>

      <!-- Dates (both inside the right column) -->
      <div class="row">
        <div class="controls-2">
          <div class="inline">
            <span class="sublabel">Start date:</span>
            <input type="date" id="drpStart" required>
          </div>
          <div class="inline">
            <span class="sublabel">End date:</span>
            <input type="date" id="drpEnd" required>
          </div>
        </div>
      </div>
      <div id="drpErr" class="drp-error"></div>

      <!-- Duration + Deadline (also inside the right column) -->
      <div class="row">
        <div class="controls-2">
          <div class="inline">
            <span class="sublabel">Duration</span>
            <select id="duration" class="select" required>
              <option value="" disabled selected hidden>Select duration…</option>
              <option value="lt1w">Less than a week</option>
              <option value="1w">One week</option>
              <option value="gt1w">More than a week</option>
              <option value="gt1m">More than a month</option>
            </select>
          </div>
          <div class="inline">
            <span class="sublabel">Deadline</span>
            <input type="date" id="deadline">
          </div>
        </div>
      </div>

      <div style="text-align:center; margin-top:6px;">
        <button type="button" id="creatTrip">Create Trip</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Show leader name
      const user = JSON.parse(localStorage.getItem('didou_user') || 'null');
      if (!user) { window.location.href = '/index.html'; return; }
      document.getElementById('leaderName').textContent = user.name || '';

      const tripName = document.getElementById('tripName');
      const dest = document.getElementById('dest');
      const start = document.getElementById('drpStart');
      const end = document.getElementById('drpEnd');
      const duration = document.getElementById('duration');
      const deadline = document.getElementById('deadline');
      const createBtn = document.getElementById('creatTrip');
      const errBox = document.getElementById('drpErr');

      const showErr = (m)=>{ errBox.textContent=m; errBox.classList.add('show'); };
      const clearErr = ()=>{ errBox.textContent=''; errBox.classList.remove('show'); };

      const todayISO = () => {
        const d = new Date(), m = String(d.getMonth()+1).padStart(2,'0'), dy = String(d.getDate()).padStart(2,'0');
        return `${d.getFullYear()}-${m}-${dy}`;
      };

      // init mins
      (function initMins(){
        const t = todayISO();
        start.min = t; end.min = t; deadline.min = t;
      })();

      function enforceDeadlineBounds(){
        const t = todayISO();
        deadline.min = t;
        if (end.value) deadline.max = end.value; else deadline.removeAttribute('max');
        if (deadline.value && deadline.value < deadline.min) deadline.value = deadline.min;
        if (deadline.value && deadline.max && deadline.value > deadline.max) deadline.value = deadline.max;
      }

      function daysBetweenInclusive(a,b){
        const s=new Date(a), e=new Date(b);
        if (isNaN(s)||isNaN(e)) return null;
        s.setHours(0,0,0,0); e.setHours(0,0,0,0);
        return Math.floor((e-s)/86400000)+1;
      }
      function rebuildDurationOptions(totalDays){
        duration.innerHTML='';
        const ph=document.createElement('option');
        ph.value=''; ph.textContent='Select duration…'; ph.disabled=true; ph.hidden=true; ph.selected=true;
        duration.appendChild(ph);
        const max=Math.min(totalDays,60);
        for(let i=1;i<=max;i++){
          const opt=document.createElement('option');
          opt.value=String(i); opt.textContent = i===1?'1 day':`${i} days`;
          duration.appendChild(opt);
        }
        if(totalDays>=1) duration.value=String(Math.min(totalDays,max));
      }
      function syncDuration(){
        clearErr();
        if(!start.value||!end.value) return;
        if(end.value<start.value){ showErr('End date must be after start date.'); return; }
        const d=daysBetweenInclusive(start.value,end.value);
        if(!d||d<=0) return;
        rebuildDurationOptions(d);
        enforceDeadlineBounds();
      }

      start.addEventListener('change', ()=>{
        const t=todayISO();
        if(start.value && start.value<t) start.value=t;
        end.min=start.value||t;
        if(end.value && end.value<end.min) end.value=end.min;
        start.max=end.value||'';
        enforceDeadlineBounds();
        syncDuration();
      });
      end.addEventListener('change', ()=>{
        const t=todayISO();
        start.max=end.value||'';
        if(!start.value && end.value<t) end.value=t;
        end.min=start.value||t;
        if(end.value && end.value<end.min) end.value=end.min;
        enforceDeadlineBounds();
        syncDuration();
      });

      // submit
      createBtn.addEventListener('click', async ()=>{
        clearErr();
        if(!tripName.value.trim() || !dest.value.trim()) return;
        if(!start.value || !end.value){ showErr('Please choose both start and end dates.'); return; }
        if(end.value<start.value){ showErr('End date must be after start date.'); return; }
        if(!duration.value){ showErr('Please choose a duration.'); return; }
        enforceDeadlineBounds();

        const payload={
          name: tripName.value.trim(),
          destination: dest.value.trim(),
          duration: duration.value,
          start_date: start.value,
          end_date: end.value,
          deadline: deadline.value || null,
          leader_id: user.id || null
        };

        try{
          createBtn.disabled=true;
          const resp=await fetch('/api/trips',{
            method:'POST', headers:{'Content-Type':'application/json'},
            body:JSON.stringify(payload)
          });
          if(!resp.ok){
            const { error } = await resp.json().catch(()=>({error:'Unknown error'}));
            alert('Failed to save trip: ' + (error || resp.statusText));
            createBtn.disabled=false; return;
          }
          const row=await resp.json();
          window.location.href=`/AllWishes.html?tripId=${encodeURIComponent(row.id)}`;
        }catch(e){
          console.error(e);
          alert('Network error saving trip (is the server running?)');
          createBtn.disabled=false;
        }
      });
    });
  </script>
</body>
</html>
