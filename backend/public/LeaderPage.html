<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        .drp-panel {
            display: block;
            margin-top: 8px;
        }

        .drp-panel.show {
            display: block;
        }

        .drp-error {
            color: #ffdddd;
            background: #7c0000;
            padding: 6px 8px;
            border-radius: 6px;
            margin-top: 8px;
            display: none;
        }

        .drp-error.show {
            display: block;
        }

        .drp-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .drp-row label {
            color: white;
            font-weight: bold;
        }

        #creatTrip {
            padding: 10px 14px;
            border-radius: 8px;
            border: 0;
            background: #efc738;
            cursor: pointer;
        }

        .header {
            color: rgb(8, 27, 240);
            font-size: 48px;
            font-style: bold;
        }

        .subHead {
            color: rgb(113, 114, 125);
            font-size: 24px;
        }

        .chosenCircle {
            width: 20px;
            height: 20px;
            background-color: blue;
            border-radius: 50%;
            border: 2px solid blue;
        }

        .otherCircle {
            width: 20px;
            height: 20px;
            background-color: rgb(113, 114, 125);
            border-radius: 50%;
            border: 2px solid rgb(113, 114, 125);
        }

        .divider {
            display: inline-block;
            width: 12px;
            height: 2px;
            background-color: rgb(113, 114, 125);
            vertical-align: middle;
            margin: 0 8px;
        }

        /* Input base style */
        input[type="text"] {
            padding: 8px 10px;
            border: 1px solid black;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        input:invalid:not(:focus):not(:placeholder-shown) {
            border-color: #d00;
        }

        .error-msg {
            display: none;
            color: #d00;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        input:invalid:not(:focus):not(:placeholder-shown)+.error-msg {
            display: block;
        }

        .bigBox {
            width: 500px;
            height: 300px;
            background-color: #3439a1;
            border: 1px solid #333;
            padding: 20px;
            margin: 30px auto;
            border-radius: 8px;
            text-align: left;
        }

        .bigBox h2 {
            color: #efc738;
            text-align: center;
        }

        .bigBox p {
            font-family: sans-serif;
        }

        /* Base select styling */
        .select {
            width: 100%;
            max-width: 320px;
            padding: 10px 40px 10px 12px;
            font-size: 14px;
            border: 1.5px solid #999;
            border-radius: 8px;
            background-color: #fff;

            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;

            background-image:
                url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23555' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
        }

        .select:hover {
            border-color: #666;
        }

        .select:focus {
            outline: none;
            border-color: #2962ff;
            box-shadow: 0 0 0 3px rgba(41, 98, 255, 0.15);
        }

        .select:disabled {
            color: #999;
            background-color: #f5f5f5;
            border-color: #ddd;
            cursor: not-allowed;
        }

        .select:invalid {
            color: #777;
        }

        .select--sm {
            max-width: 160px;
            padding: 8px 32px 8px 10px;
            font-size: 13px;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title> Trip Create </title>
</head>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Elements
        const tripName = document.getElementById('tripName');
        const dest = document.getElementById('dest');
        const duration = document.getElementById('duration');
        const start = document.getElementById('drpStart');
        const end = document.getElementById('drpEnd');
        const deadline = document.getElementById('deadline');
        const createBtn = document.getElementById('creatTrip');
        const errBox = document.getElementById('drpErr');

        // helpers
        const showErr = (msg) => { errBox.textContent = msg; errBox.classList.add('show'); };
        const clearErr = () => { errBox.textContent = ''; errBox.classList.remove('show'); };

        function daysBetweenInclusive(isoStart, isoEnd) {
            const s = new Date(isoStart);
            const e = new Date(isoEnd);
            if (Number.isNaN(s) || Number.isNaN(e)) return null;
            s.setHours(0, 0, 0, 0); e.setHours(0, 0, 0, 0);
            return Math.floor((e - s) / 86400000) + 1;
        }

        function rebuildDurationOptions(totalDays) {
            duration.innerHTML = '';
            const ph = document.createElement('option');
            ph.value = ''; ph.textContent = 'Select duration…'; ph.disabled = true; ph.hidden = true; ph.selected = true;
            duration.appendChild(ph);
            const max = Math.min(totalDays, 60);
            for (let i = 1; i <= max; i++) {
                const opt = document.createElement('option');
                opt.value = String(i);
                opt.textContent = i === 1 ? '1 day' : `${i} days`;
                duration.appendChild(opt);
            }
            if (totalDays >= 1) duration.value = String(Math.min(totalDays, max));
        }

        function syncDurationFromDates() {
            clearErr();
            if (!start.value || !end.value) return;
            if (end.value < start.value) { showErr('End date must be after start date.'); return; }
            const d = daysBetweenInclusive(start.value, end.value);
            if (!d || d <= 0) return;
            rebuildDurationOptions(d);
            // also keep deadline bounded by [today, end]
            enforceDeadlineBounds();
        }

        // ===== Deadline rules =====
        function todayISO() {
            const d = new Date();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${d.getFullYear()}-${m}-${day}`;
        }

        function enforceDeadlineBounds() {
  if (!deadline) return;
  const today = todayISO();

  // Deadline can be any date from *today* onward...
  deadline.min = today;

  // ...but still cap it at End date if one is chosen.
  if (end.value) {
    deadline.max = end.value;
  } else {
    deadline.removeAttribute('max');
  }

  // Clamp current value into the new range
  if (deadline.value && deadline.value < deadline.min) deadline.value = deadline.min;
  if (deadline.value && deadline.max && deadline.value > deadline.max) deadline.value = deadline.max;
}


        // --- Prevent past dates & set initial mins ---
        (function initDateMins() {
            const t = todayISO();

            // Start date: cannot be in the past
            start.min = t;
            if (start.value && start.value < t) start.value = t;

            // End date: cannot be before start; if no start yet, at least today
            end.min = start.value || t;
            if (end.value && end.value < end.min) end.value = end.min;

            // Deadline: from today (and enforceDeadlineBounds will raise it to start if needed)
            if (deadline) deadline.min = t;
        })();

        // listeners to keep constraints in sync
        start.addEventListener('change', () => {
            const t = todayISO();

            // clamp start to today
            if (start.value && start.value < t) start.value = t;

            // end cannot be before start; if start cleared, end can't be before today
            end.min = start.value || t;
            if (end.value && end.value < end.min) end.value = end.min;

            // keep an optional max on start tied to end
            start.max = end.value || '';

            enforceDeadlineBounds();
            syncDurationFromDates();
        });

        end.addEventListener('change', () => {
            const t = todayISO();

            // keep start <= end
            start.max = end.value || '';

            // ensure end respects at least today if start is empty
            if (!start.value && end.value < t) end.value = t;

            // ensure min for end stays coherent
            end.min = start.value || t;
            if (end.value && end.value < end.min) end.value = end.min;

            enforceDeadlineBounds();
            syncDurationFromDates();
        });

        // init deadline once (after mins are set)
        enforceDeadlineBounds();

        // ===== Submit/Create =====
        createBtn.addEventListener('click', async () => {
            clearErr();
            if (!tripName.value.trim() || !dest.value.trim()) return;
            if (!start.value || !end.value) { showErr('Please choose both start and end dates.'); return; }
            if (end.value < start.value) { showErr('End date must be after start date.'); return; }
            if (!duration.value) { showErr('Please choose a duration.'); return; }

            // final bounds enforcement before submit
            enforceDeadlineBounds();

            const payload = {
                name: tripName.value.trim(),
                destination: dest.value.trim(),
                duration: duration.value,
                start_date: start.value,
                end_date: end.value,
                deadline: deadline.value || null,
            };

            try {
                createBtn.disabled = true;
                const resp = await fetch('/api/trips', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!resp.ok) {
                    const { error } = await resp.json().catch(() => ({ error: 'Unknown error' }));
                    alert('Failed to save trip: ' + (error || resp.statusText));
                    createBtn.disabled = false;
                    return;
                }
                const row = await resp.json();
                window.location.href = `/LeaderView.html?tripId=${encodeURIComponent(row.id)}`;
            } catch (e) {
                console.error(e);
                alert('Network error saving trip (is the server running?)');
                createBtn.disabled = false;
            }
        });

        // Optional: prefill duration if dates exist on load
        syncDurationFromDates();
    });
</script>

<body style="background-color: #648de5;">
    <div style="text-align:center;">
        <img src="logo.png" alt="Logo" width="141" height="200">
    </div>
    <div class="bigBox">
        <h2>(Trip Leader) </h2>
        <label for="tripName" style="color: white;font-weight:bold;">Trip Name</label>
        <input type="text" id="tripName" name="tripName" placeholder="Enter your trip name" required>
        <div class="error-msg">Please enter a trip name.</div>

        <br><br>

        <label for="dest" style="color: white;font-weight:bold;">Destination City</label>
        <input type="text" id="dest" name="dest" placeholder="Enter your destination city" required>

        <div class="drp-panel" id="drpPanel">
            <div class="drp-row">
                <label style="color: white;font-weight:bold;">Start date:</label>
                <input type="date" id="drpStart" required>
                <label style="color: white;font-weight:bold;">End date:</label>
                <input type="date" id="drpEnd" required>
            </div>
            <div class="drp-error" id="drpErr"></div>
        </div>

        <div class="drp-row" style="margin-top:8px;">
            <label for="duration" style="color:white;font-weight:bold;">Duration</label>
            <select id="duration" name="duration" class="select select--sm" required>
                <option value="" disabled selected hidden>Select duration…</option>
                <option value="lt1w">Less than a week</option>
                <option value="1w">One week</option>
                <option value="gt1w">More than a week</option>
                <option value="gt1m">More than a month</option>
            </select>

            <label for="deadline" style="color:white;font-weight:bold; margin-left:12px;">Deadline</label>
            <input type="date" id="deadline">
        </div>

        <div style="text-align:center;">
            <br>
            <button type="button" id="creatTrip" style="font-weight: bold;">Create Trip</button>
        </div>
    </div>
</body>

</html>
