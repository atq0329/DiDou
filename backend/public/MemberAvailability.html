<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>DiDou — Plan Availability</title>
  <style>
    :root{
      --bg:#2b3398;
      --panel:#232a86;
      --chip:#6b739e;
      --chip-sel:#1bb36b;
      --accent:#efc738;
      --text:#ffffff;
    }
    html,body{margin:0;height:100%;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:1100px;margin:18px auto;padding:0 16px}
    .logo-top{text-align:center;margin:4px 0 10px}
    .logo-top img{width:110px;height:110px;object-fit:contain}

    .board{background:var(--panel);border-radius:16px;padding:24px 20px;box-shadow:0 16px 40px rgba(0,0,0,.25)}
    .name-line{text-align:center;opacity:.95;font-size:18px;margin:4px 0 6px}
    .trip-title{text-align:center;font-size:52px;margin:4px 0 8px;color:var(--accent);font-weight:800;letter-spacing:.5px}
    .sub{text-align:center;color:#d6dcff;margin:6px 0 18px;font-size:18px}

    .month{text-align:center;font-size:34px;font-weight:800;margin:10px 0 8px}
    .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
    .chip{padding:10px 16px;border-radius:8px;background:var(--chip);color:#eef1ff;user-select:none;cursor:pointer;transition:transform 80ms ease, background 120ms ease}
    .chip:hover{transform:translateY(-1px)}
    .chip.sel{background:var(--chip-sel);color:#fff}

    .toolbar{display:flex;gap:12px;justify-content:center;margin:16px 0 8px}
    .btn{border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-weight:800}
    .primary{background:var(--accent);color:#222}
    .secondary{background:#f2f2f2;color:#222}

    .msg{text-align:center;margin-top:8px}
    .msg.err{background:#7c0000;color:#ffdada;display:inline-block;padding:8px 12px;border-radius:8px}
    .msg.ok{background:#0d5f3a;color:#c7f0da;display:inline-block;padding:8px 12px;border-radius:8px}

    h3.table-title{text-align:center;margin:22px 0 10px}
    table{width:100%;border-collapse:collapse;background:#fff;color:#222;border-radius:10px;overflow:hidden}
    th,td{padding:10px 12px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:15px}
    th{background:#f8fafc}
  </style>
</head>
<body>
<div class="wrap">
  <div class="logo-top"><img src="logo.JPG" alt="DiDou logo"></div>

  <div class="board">
    <div id="nameLine" class="name-line">Trip Member</div>
    <div id="tripTitle" class="trip-title">TRIP_NAME</div>

    <div class="sub" id="subtitle">Loading…</div>

    <div class="month" id="monthLbl">Month</div>
    <div id="chips" class="chips"></div>

    <div class="toolbar">
      <button id="clearBtn" class="btn secondary">Clear</button>
      <button id="submitBtn" class="btn primary">Submit availability</button>
    </div>
    <div id="msg" class="msg"></div>

    <h3 class="table-title">All members</h3>
    <table>
      <thead><tr><th>Name</th><th>Email</th><th>Start</th><th>End</th><th>Days</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
const API_BASE = location.origin;
const api = (path) => `${API_BASE}${path.startsWith('/') ? path : `/${path}`}`;

(() => {
  // -------- DOM & context --------
  const params = new URLSearchParams(location.search);
  const tripId = params.get('tripId');                           // e.g. F00V9QPW
  const stored = JSON.parse(localStorage.getItem('didou_user') || '{}');
  const currentUser = {
    id: Number(params.get('userId') || stored.id || 0),
    name: stored.name || 'Trip Member',
    email: stored.email || ''
  };

  const $ = s => document.querySelector(s);
  const nameLine = $('#nameLine'), tripTitle = $('#tripTitle'), subtitle = $('#subtitle');
  const monthLbl = $('#monthLbl'), chipsBox = $('#chips'), tbody = $('#tbody');
  const clearBtn = $('#clearBtn'), submitBtn = $('#submitBtn'), msg = $('#msg');

  // -------- Date helpers (guarded) --------
  const isISO = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
  const toDate = s => isISO(s) ? new Date(s + 'T00:00:00Z') : null;
  const iso = d => d.toISOString().slice(0,10);
  const addDays = (s,n) => { const dt = toDate(s); dt.setUTCDate(dt.getUTCDate()+n); return iso(dt); };
  const daysInclusive = (a,b) => {
    const A = toDate(a), B = toDate(b);
    if (!A || !B) return NaN;
    return Math.floor((B - A)/86400000) + 1;
  };
  const fmt = s => {
    const dt = toDate(s);
    return dt ? dt.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }) : '—';
  };

  // -------- State --------
  let trip = null, days = [], selStart = null, selEnd = null, minDays = 1;

  // -------- UI helpers --------
  function clearMsg(){ msg.textContent=''; msg.className='msg'; }
  function showErr(m){ msg.textContent=m; msg.className='msg err'; }
  function showOk(m){ msg.textContent=m; msg.className='msg ok'; }

  function paint(){
    if (days.length){
      const first = toDate(days[0]);
      monthLbl.textContent = first.toLocaleDateString('en-US', { month:'long', year:'numeric' });
    } else {
      monthLbl.textContent = 'Month';
    }
    chipsBox.innerHTML = '';
    days.forEach(d => {
      const el = document.createElement('div');
      el.className = 'chip';
      el.textContent = new Date(d+'T00:00:00Z').toLocaleDateString('en-US', { month:'short', day:'numeric' });
      if (selStart && selEnd && d >= selStart && d <= selEnd) el.classList.add('sel');
      el.addEventListener('click', () => onPick(d));
      chipsBox.appendChild(el);
    });
  }

  function onPick(d){
    clearMsg();
    if (!selStart){
      selStart = d;
      selEnd = addDays(d, Math.max(0, minDays-1));
      if (toDate(selEnd) > toDate(days[days.length-1])) selEnd = days[days.length-1];
      return paint();
    }
    if (toDate(d) < toDate(selStart)) selStart = d; else selEnd = d;

    // clamp + enforce min
    if (toDate(selStart) < toDate(days[0])) selStart = days[0];
    if (toDate(selEnd) > toDate(days[days.length-1])) selEnd = days[days.length-1];
    if (daysInclusive(selStart, selEnd) < minDays){
      selEnd = addDays(selStart, minDays-1);
      if (toDate(selEnd) > toDate(days[days.length-1])) selEnd = days[days.length-1];
    }
    paint();
  }

  clearBtn.addEventListener('click', () => { selStart = selEnd = null; clearMsg(); paint(); });

  // -------- Data loads --------
  async function loadTrip(){
    if (!tripId){ subtitle.textContent = 'Missing tripId'; return; }

    const url = api(`/api/trips/${encodeURIComponent(tripId)}`);
    subtitle.textContent = 'Loading trip…';
    console.log('[trip] GET', url);

    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 10000);

    try {
      const r = await fetch(url, { headers:{'Accept':'application/json'}, cache:'no-store', signal: ctl.signal });
      const raw = await r.text();
      const ct = r.headers.get('content-type') || '';
      const isJson = ct.includes('application/json');
      const payload = isJson ? JSON.parse(raw) : null;

      if (!r.ok){
        console.error('[trip] HTTP', r.status, raw);
        subtitle.textContent = (r.status === 404) ? 'Trip not found' : `Error ${r.status}`;
        return;
      }
      if (!isJson){
        console.error('[trip] Non-JSON response:', raw);
        subtitle.textContent = 'Server returned non-JSON for trip';
        return;
      }

      const tripRow = payload.trip || payload; // support both shapes
      trip = tripRow;

      nameLine.textContent = `${currentUser.name} (Trip Member)`;
      tripTitle.textContent = trip.name || trip.id || 'Trip';

      minDays = Number(trip.duration);
      if (!Number.isFinite(minDays) || minDays < 1) minDays = 1;

      const start = trip.start_date;
      const end   = trip.end_date;

      if (!isISO(start) || !isISO(end) || toDate(end) < toDate(start)){
        console.warn('[trip] Bad/missing dates', { start, end });
        subtitle.textContent = 'Trip dates are not set yet.';
        return;
      }

      subtitle.textContent = `Please input your availability — window ${fmt(start)} → ${fmt(end)}, minimum ${minDays} day(s).`;

      days = [];
      for (let d = start; toDate(d) <= toDate(end); d = addDays(d, 1)) days.push(d);
      paint();

      await refreshTable();
    } catch (e) {
      console.error('[trip] load error:', e);
      subtitle.textContent = (e.name === 'AbortError') ? 'Timeout loading trip' : 'Network error';
    } finally {
      clearTimeout(timer);
    }
  }

  async function refreshTable(){
    const url = api(`/api/trips/${encodeURIComponent(tripId)}/availability`);
    console.log('[avail] GET', url);
    try {
      const r = await fetch(url, { headers:{'Accept':'application/json'}, cache:'no-store' });
      if (!r.ok) { console.warn('[avail] HTTP', r.status); return; }
      const ct = r.headers.get('content-type') || '';
      if (!ct.includes('application/json')) { console.warn('[avail] non-JSON'); return; }
      const data = await r.json();
      if (!data.ok) return;
      tbody.innerHTML = (data.list || []).map(row => {
        const len = daysInclusive(row.avail_start, row.avail_end);
        return `<tr>
          <td>${row.name || ''}</td>
          <td>${row.email || ''}</td>
          <td>${fmt(row.avail_start)}</td>
          <td>${fmt(row.avail_end)}</td>
          <td>${Number.isFinite(len) ? len : '—'}</td>
        </tr>`;
      }).join('');
    } catch (e) {
      console.error('[avail] load error:', e);
    }
  }

  submitBtn.addEventListener('click', async () => {
    clearMsg();
    if (!selStart || !selEnd) return showErr('Please select your availability.');
    const len = daysInclusive(selStart, selEnd);
    if (len < minDays) return showErr(`Select at least ${minDays} day(s).`);
    if (!currentUser.id) return showErr('Missing user. Please sign in again.');

    const url = api(`/api/trips/${encodeURIComponent(tripId)}/availability`);
    console.log('[avail] POST', url, { user_id: currentUser.id, selStart, selEnd });
    try {
      const r = await fetch(url, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ user_id: currentUser.id, avail_start: selStart, avail_end: selEnd })
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || !data.ok) return showErr((data && data.error) || 'Failed to save');
      showOk('Saved!');
      await refreshTable();
    } catch (e) {
      showErr('Network error');
    }
  });

  // kick it off
  loadTrip();
})();
</script>
</body>
</html>
