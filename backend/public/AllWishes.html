<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leader View</title>
    <style>
        /* Page base */
        body {
            background: #3439a1;
            margin: 0;
            font-family: system-ui, Arial, sans-serif;
        }

        /* Header row (logo | title | actions) */
        .row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
        }

        .row img {
            justify-self: start;
        }

        .row h2 {
            justify-self: center;
            margin: 0;
            color: #efc738;
            font-weight: 100;
        }

        /* Title */
        .page-title {
            color: #efc738;
            text-align: center;
            margin: 0;
            font-weight: 700;
            font-size: 50px;
        }

        /* Right-side details trigger */
        .details-wrap {
            position: relative;
            justify-self: end;
        }

        #tripDetails {
            padding: 8px 12px;
            border-radius: 12px;
            background: #d9d9d9;
            color: #000;
            border: 0;
            font-weight: 600;
            cursor: pointer;
            width: max-content;
            display: inline-block;
        }

        #tripDetails:hover {
            filter: brightness(.95);
        }

        /* Popover card (absolutely positioned so it doesn't shift layout) */
        #tripDescription {
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            display: none;
            min-width: 280px;
            padding: 12px 16px;
            border-radius: 12px;
            background: #d9d9d9;
            color: #000;
            box-shadow: 0 10px 24px rgba(0, 0, 0, .22);
            z-index: 1000;
            font-weight: 400;
        }

        #tripDescription.show {
            display: block;
        }

        /* Card content */
        #tripDescription .trip-name {
            display: block;
            font-size: 24px;
            font-weight: 800;
            line-height: 1.1;
            color: #0f172a;
            text-align: center;
            margin: 0 0 10px;
            letter-spacing: .2px;
        }

        #tripDescription .trip-name::after {
            content: "";
            display: block;
            width: 48px;
            height: 3px;
            margin: 6px auto 0;
            border-radius: 999px;
            background: #efc738;
        }

        #tripDescription .line {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 2px 0;
        }

        #tripDescription .label {
            font-weight: 700;
        }

        #tripDescription p {
            margin: 0;
        }

        #tripDescription span,
        #tripDescription p {
            line-height: 1.2;
        }

        /* Copy icon + toast */
        .copy-icon {
            cursor: pointer;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, .85);
            color: #fff;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s, transform .2s;
            z-index: 9999;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-4px);
        }

        /* Action buttons */
        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
        }

        .actions button {
            padding: 10px 14px;
            border-radius: 8px;
            border: 0;
            font-weight: 600;
            cursor: pointer;
            color: #1a1a1a;
        }

        #viewWishlist {
            background: #eb90d3;
        }

        /* pink */
        #editPlan {
            background: #ffd900;
        }

        /* yellow */
        #viewWishlist:hover,
        #editPlan:hover {
            filter: brightness(.95);
        }

        /* force the whole Start/End group to stay on one line */
        #tripDescription .line.start-end {
            display: flex;
            align-items: center;
            flex-wrap: nowrap;
            /* no wrapping */
            gap: 10px;
        }

        /* prevent breaking inside each label/value */
        #tripDescription .label,
        #tripDescription .value {
            white-space: nowrap;
        }

        /* adjustable spacing between the two date groups */
        #tripDescription .line.start-end .gap {
            width: 24px;
            /* tweak this to taste */
            flex: 0 0 24px;
        }
    </style>
</head>

<body>
    <!-- Header row -->
    <div class="row">
        <img src="logo.png" alt="Logo" width="106" height="150" />
        <h2 id="leaderHeader">(Trip Leader)</h2>

        <div class="details-wrap">
            <button id="tripDetails" aria-controls="tripDescription" aria-expanded="false">
                View trip details
            </button>

            <!-- Popover card (hidden by default) -->
            <div id="tripDescription" role="dialog" aria-label="Trip details">
                <span class="trip-name" id="tripNameBtn"></span>

                <div class="line">
                    <span class="label">Trip ID:</span>
                    <span id="tripID"></span>
                    <img id="copyTripId" src="copy.png" alt="Copy" width="20" height="20" class="copy-icon"
                        title="Copy trip ID" />
                </div>

                <div class="line start-end">
                    <span class="label">Start date:</span>
                    <span id="tripStart" class="value"></span>

                    <span class="gap"></span>

                    <span class="label">End date:</span>
                    <span id="tripEnd" class="value"></span>
                </div>


                <div class="line">
                    <span class="label">Location:</span>
                    <span id="tripLocation"></span>
                </div>

                <div class="line">
                    <span class="label">Members:</span>
                    <span id="memberCount"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Page title (centered, not affected by popover) -->
    <h1 id="tripTitle" class="page-title"></h1>
    <h2> List of all Wishes</h2>
    
    <!-- Toast -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
        const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

        function formatDMY(iso) {
            if (!iso) return "—";

            // Try native Date first (works for full ISO strings)
            const d = new Date(iso);
            if (!isNaN(d)) {
                const day = String(d.getDate()).padStart(2, "0");
                const mon = MONTHS[d.getMonth()];
                const yr = d.getFullYear();
                return `${day} ${mon} ${yr}`;
            }

            // Fallback: grab the first YYYY-MM-DD if it's a plain date string
            const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
            if (m) {
                const [, y, mm, dd] = m;
                return `${dd} ${MONTHS[+mm - 1]} ${y}`;
            }

            return "—";
        }

        // Fetch and populate
        (async function () {
            const params = new URLSearchParams(location.search);
            const id = params.get('tripId');
            if (!id) {
                document.getElementById('tripTitle').textContent = 'No trip selected';
                return;
            }

            try {
                const resp = await fetch(`/api/trips/${encodeURIComponent(id)}`);
                if (!resp.ok) throw new Error('Trip not found');
                const trip = await resp.json();

                // Title + header
                document.getElementById('tripTitle').textContent = trip.name || `Trip #${id}`;
                document.getElementById('leaderHeader').textContent =
                    trip.leader_name ? `(Trip Leader: ${trip.leader_name})` : `(Trip Leader)`;

                // Card details
                document.getElementById('tripNameBtn').textContent = trip.name || `Trip #${id}`;
                document.getElementById('tripID').textContent = trip.id || id;
                document.getElementById('tripLocation').textContent = trip.destination ?? '';
                document.getElementById('tripStart').textContent = formatDMY(trip.start_date);
                document.getElementById('tripEnd').textContent = formatDMY(trip.end_date);

                document.getElementById('memberCount').textContent = trip.member_count ?? 0;

            } catch (e) {
                document.getElementById('tripTitle').textContent = `Trip #${id}`;
                console.error(e);
            }
        })();

        // Hover popover (doesn’t shift layout)
        (function () {
            const btn = document.getElementById('tripDetails');
            const card = document.getElementById('tripDescription');
            if (!btn || !card) return;

            const show = () => {
                card.classList.add('show');
                btn.setAttribute('aria-expanded', 'true');
            };
            const hideIfOutside = () => {
                setTimeout(() => {
                    if (!btn.matches(':hover') && !card.matches(':hover')) {
                        card.classList.remove('show');
                        btn.setAttribute('aria-expanded', 'false');
                    }
                }, 50);
            };

            btn.addEventListener('mouseenter', show);
            btn.addEventListener('focus', show);
            card.addEventListener('mouseenter', show);
            btn.addEventListener('mouseleave', hideIfOutside);
            card.addEventListener('mouseleave', hideIfOutside);
            btn.addEventListener('blur', hideIfOutside);
        })();

        // Copy Trip ID (with toast)
        (function () {
            const copyIcon = document.getElementById('copyTripId');
            const tripIdEl = document.getElementById('tripID');
            const toast = document.getElementById('toast');
            if (!copyIcon || !tripIdEl || !toast) return;

            const showToast = (msg, ms = 1200) => {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(showToast._t);
                showToast._t = setTimeout(() => toast.classList.remove('show'), ms);
            };

            copyIcon.addEventListener('click', async (e) => {
                e.stopPropagation(); // don’t trigger the popover button
                const text = (tripIdEl.textContent || '').trim();
                if (!text) return;

                try {
                    await navigator.clipboard.writeText(text);
                    showToast('Trip ID copied ✔');
                } catch {
                    // Fallback for older browsers
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    try { document.execCommand('copy'); } finally { document.body.removeChild(ta); }
                    showToast('Trip ID copied ✔');
                }
            });
        })();
    </script>
</body>

</html>
