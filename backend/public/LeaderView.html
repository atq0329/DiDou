<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DiDou - Leader View</title>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:12px 16px;background:#3439a1;color:#fff}
    .trip-pop{position:relative;justify-self:end}
    .pop-card{position:absolute;right:0;top:calc(100% + 8px);background:#fff;color:#000;padding:12px;border-radius:12px;min-width:280px;box-shadow:0 10px 24px rgba(0,0,0,.22)}
    .hidden{display:none}
    .page-title{color:#efc738;text-align:center;margin:18px 0}
    .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0 20px}
    .members{max-width:900px;margin:0 auto 28px}
  </style>
</head>
<body>
  <!-- Header -->
  <div class="topbar">
    <img src="logo.JPG" alt="Logo" width="106" height="150"/>
    <h2 id="leaderHeader" style="justify-self:center;margin:0;color:#efc738">(Trip Leader)</h2>
    <div class="trip-pop">
      <button id="tripDetails" class="secondary">View trip details</button>
      <div id="tripDescription" class="pop-card hidden" aria-label="Trip details">
        <div style="font-weight:800;margin-bottom:6px" id="tripNameBtn"></div>
        <div style="display:flex;align-items:center;gap:6px">
          <b>ID:</b><span id="tripID"></span>
          <img id="copyTripId" src="copy.jpg" alt="Copy" width="20" height="20" style="cursor:pointer;opacity:.8"/>
        </div>
        <div style="margin-top:6px"><b>Start:</b> <span id="tripStart"></span> — <b>End:</b> <span id="tripEnd"></span></div>
        <div><b>Location:</b> <span id="tripLocation"></span></div>
        <div><b>Members:</b> <span id="memberCount"></span></div>
      </div>
    </div>
  </div>

  <!-- Title -->
  <h1 id="tripTitle" class="page-title">Loading…</h1>

  <!-- Quick actions -->
  <div class="actions">
    <button id="shareTrip" class="primary">Share Trip Link</button>
    <button id="goWishlist" class="secondary">Go to Wishlist</button>
    <button id="goAvailability" class="secondary">View Availability</button>
  </div>

  <!-- Members table -->
  <div class="members">
    <h3 class="center" style="color:#3439a1;margin-bottom:10px">Trip Members</h3>
    <table>
      <thead>
        <tr><th>Name</th><th>Email</th><th>Available From</th><th>Available To</th><th>Days</th></tr>
      </thead>
      <tbody id="membersTableBody">
        <tr><td colspan="5" class="center">Loading…</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // --- helpers ---
    const params = new URLSearchParams(location.search);
    const tripId = params.get('tripId');
    const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const fmt = iso => {
      if (!iso) return "—";
      const d = new Date(iso + "T00:00:00Z");
      return isNaN(d) ? "—" : `${String(d.getUTCDate()).padStart(2,"0")} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
    };
    const daysBetween = (a,b)=> {
      const A=new Date(a+"T00:00:00Z"),B=new Date(b+"T00:00:00Z");
      return isNaN(A)||isNaN(B)?0:Math.floor((B-A)/86400000)+1;
    };
    const $ = s => document.querySelector(s);

    // --- API loaders ---
    async function loadTrip(){
      const r=await fetch(`/api/trips/${encodeURIComponent(tripId)}`);
      if(!r.ok) throw new Error("Trip not found");
      return await r.json();
    }
    async function loadAvailability(){
      const r=await fetch(`/api/trips/${encodeURIComponent(tripId)}/availability`);
      if(!r.ok) throw new Error("Availability error");
      return await r.json();
    }

    // --- init ---
    (async()=>{
      if(!tripId){ $("#tripTitle").textContent="No trip selected"; return; }
      try{
        const trip=await loadTrip();
        $("#tripTitle").textContent=trip.name||trip.id;
        $("#leaderHeader").textContent=trip.leader_name?`(Trip Leader: ${trip.leader_name})`:"(Trip Leader)";
        $("#tripNameBtn").textContent=trip.name||trip.id;
        $("#tripID").textContent=trip.id;
        $("#tripLocation").textContent=trip.destination||"—";
        $("#tripStart").textContent=fmt(trip.start_date);
        $("#tripEnd").textContent=fmt(trip.end_date);
        $("#memberCount").textContent=trip.member_count??0;

        const data=await loadAvailability();
        const tbody=$("#membersTableBody");
        if(!data.list || !data.list.length){
          tbody.innerHTML='<tr><td colspan="5" class="center">No members yet</td></tr>';
        }else{
          tbody.innerHTML=data.list.map(m=>{
            const d=daysBetween(m.avail_start,m.avail_end);
            return `<tr>
              <td>${m.name||'—'}</td>
              <td>${m.email||'—'}</td>
              <td>${fmt(m.avail_start)}</td>
              <td>${fmt(m.avail_end)}</td>
              <td>${d} day${d!==1?'s':''}</td>
            </tr>`;
          }).join("");
        }
      }catch(e){
        console.error(e);
        $("#tripTitle").textContent="Error loading trip";
      }
    })();

    // --- actions ---
    // Share link for members to set availability
    $("#shareTrip").addEventListener("click", async ()=>{
      const url=`${location.origin}/MemberAvailability.html?tripId=${encodeURIComponent(tripId)}`;
      try{
        await navigator.clipboard.writeText(url);
        alert("Shareable availability link copied!");
      }catch{
        alert("Copy failed. Link:\n" + url);
      }
    });

    // NEW: Go to Wishlist
    $("#goWishlist").addEventListener("click", ()=>{
      location.href = `/AllWishes.html?tripId=${encodeURIComponent(tripId)}`;
    });

    // NEW: View Availability page (as leader)
    $("#goAvailability").addEventListener("click", ()=>{
      location.href = `/MemberAvailability.html?tripId=${encodeURIComponent(tripId)}`;
    });

    // trip details popover
    $("#tripDetails").addEventListener("click", ()=>{
      $("#tripDescription").classList.toggle("hidden");
    });

    // copy trip id
    $("#copyTripId").addEventListener("click", async ()=>{
      try{
        await navigator.clipboard.writeText($("#tripID").textContent);
        alert("Trip ID copied!");
      }catch{}
    });

    // close popover when clicking outside
    document.addEventListener('click', (e)=>{
      const pop = $("#tripDescription");
      const btn = $("#tripDetails");
      if (!pop.contains(e.target) && e.target !== btn) pop.classList.add('hidden');
    });
  </script>
</body>
</html>
